<!doctype html>
<html>
  <head>
    <title>TaskFlow Flask</title>

    <style>
      body {
        font-family: Arial;
        background: #eef2f7;
      }

      .container {
        width: 600px;
        margin: auto;
        margin-top: 60px;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      }

      input {
        padding: 8px;
        margin: 5px;
      }

      button {
        padding: 8px 12px;
        background: #4caf50;
        border: none;
        color: white;
      }

      .task {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        padding: 10px;
        background: #f3f3f3;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Task Flow Flask</h1>

      <form action="/add" method="POST">
        <input name="title" placeholder="title" required />
        <input name="description" placeholder="description" />

        <button type="submit">Add</button>
      </form>

      <h3>Task List</h3>

      {% for task in tasks %}

      <div class="task">
        <div>
          <b>{{task.title}}</b>
          <br />
          {{task.description}}
        </div>

        <a href="/delete/{{task.id}}">Delete</a>
      </div>

      {% endfor %}
    </div>
  </body>
</html>
